[package]
name = "olsync"
version = "0.2.2"
edition = "2021"
authors = ["Konrad Höffner <konrad.hoeffner@uni-leipzig.de>"]
description = "Generate an OLS YAML configuration file from an existing OLS instance"
readme = "README.md"
repository = "https://github.com/annosaxfdm/olsync/"
license = "MIT"
keywords = ["ontology"]
categories = ["command-line-utilities"]

[dependencies]
anyhow = "1.0.105"
env_logger = "0.11.12"
log = "0.4.35"
reqwest = { version= "0.13.5", default-features=false, features=["blocking", "json", "rustls"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
